# world-model-lab 默认配置
# 超参全部外置，便于扫参与云 GPU 上批量复现

seed: 0
device: auto            # auto -> 有 CUDA 用 CUDA，否则 CPU。云端加 --device cuda 即可

env:
  id: CartPole-v1       # 后续换 UAV 轨迹 / 无线信道场景时只改这一行 + envs/ 下加 Adapter
  max_steps: 500

data:
  n_episodes: 600       # 用随机策略采集的转移数据量（CartPole 随机策略平均仅 ~20 步/集）

model:
  latent_dim: 32        # 潜空间维度（B1 的 H_t/Z_t 因子化会在此扩展）
  hidden: 128
  discrete_act: true

train:
  epochs: 150
  batch_size: 256
  lr: 0.001
  weight_decay: 0.0
  grad_clip: 5.0
  val_ratio: 0.1

eval:
  # 多步 rollout 视界（步）。用来画"预测误差随步数增长"的曲线。
  # 上限受数据限制：随机策略在 CartPole 上平均仅 ~20 步/集，故最长取 15。
  # 换 Pendulum（每集固定 200 步）或 UAV 轨迹数据后可延长到 50+。
  horizons: [1, 2, 3, 4, 5, 6, 8, 10, 12, 15]
  # 可靠视界判据：归一化 MSE 首次超过该阈值的那一步
  err_threshold: 0.05
  threshold_mode: rel    # rel = 相对该步的观测方差；abs = 绝对 MSE

output:
  dir: outputs

# ★ X5 新增（2026-09-21）：手写 PPO 的超参（scripts/09_train_ppo.py 读这一段）
# 超参外置的理由与世界模型侧相同：扫参与云端复现时不改代码。
ppo:
  total_steps: 150000       # 总交互步数；CartPole-v1 上通常 5–10 万步可达 500 上限
  rollout_steps: 128        # 每次 update 采集的 on-policy 步数
  update_epochs: 4          # 同一批数据复用几轮（PPO 靠 clip 才敢 >1）
  minibatch_size: 32
  lr: 0.0003
  gamma: 0.99
  gae_lambda: 0.95          # GAE 的偏差-方差旋钮：0=一步TD(低方差高偏差)，1=MC(无偏高方差)
  clip_eps: 0.2
  vf_coef: 0.5              # 价值项系数
  ent_coef: 0.01            # 熵奖励系数（符号陷阱：进 loss 时取负号以"上升"熵）
  max_grad_norm: 0.5
  hidden: 64
  eval_every: 10            # 每 N 次 update 做一次确定性评估
  n_eval_episodes: 5
  target_return: 450.0      # X5 判据（CartPole-v1 上限 500）
