# world-model-lab · ★ X35「任务锚定的联合设计：闭式选的 (T,b) 还是不是任务最优的」
#
# ★★ 由来（为什么必须有这一号实验）
#   X34 证明了 (T, b) 的设计曲线可以用闭式算出来 —— 但它优化的是 **估计误差 NMSE**。
#   X30 已经实测过：H*_task（逃逸率 / 跟踪距离定义的"任务还能撑多久"）与
#   H*_err（误差超阈）**不是同一个数**，在本场景差到 32 倍。
#   ⇒ 那么"按 NMSE 选出来的设计点"很可能**不是**"按任务选出来的设计点"。
#   X35 就是把这件事测出来：同一张 (T,b) 设计网格，同时记 NMSE 与任务指标，
#   看两者的 argmin 是不是同一个点。
#
# ★★ 与 X34 的关键差别：**这里跑的是真闭环**
#   X33/X34 的 run_tracking 是**开环回放**（动作来自预先采好的 episode ⇒
#   轨迹与模型无关）。X35 用 wmlab.control.run_closed_loop_control：
#   动作来自 controller(est) ⇒ **模型误差会改真实轨迹**，误差因此会累积/放大。
#   ⇒ 量化误差（payload_fn）第一次真正进入闭环。
#
# ★ SNR 取点的依据（不是拍的）
#   X33 反解出的标定（目标 PER=0.4）：m=2→4.8dB, m=4→12.6dB, m=6→19.1dB, m=8→25.3dB。
#   ⇒ 14–26dB 正是"高阶分枝已经烂、低阶分枝还很干净"的区间，
#     只有在这里 E[age] = T·q/(1−q) + (T−1)/2 才会出现**内点最优**（不是永远选最小 T）。
#
# ★ 预写判据（跑前定死，不许事后编解释）
#   T1  ★ 任务指标从最优点挪到次优点的**相对退化** ≥ NMSE 的 2 倍
#       （理由：闭环把估计误差放大 + 逃逸是阈值事件，均值指标会把它糊掉）
#   T2  排序一致性 Spearman(est_nmse, escape_rate)：预写 ρ ≥ 0.8（两者大致同向）。
#       若实测 ρ < 0.8 ⇒ **NMSE 不能当任务指标的代理**，照报，这正是本实验要的结论之一
#   T3  ★ model vs persistence 在**任务指标**上的差距 ≥ 在 NMSE 上的差距 × 1.2
#       （X30 实测：T=64 时逃逸率 0.42 vs 0.92 —— 差 2.2 倍，而同口径 est_nmse 差得更小）
#   T4  ★ R12：改 b 必须改变**闭环**结果（否则 payload_fn 没接进 control.py，实验在空跑）
#   T5  闭式预报（在开环轨迹上标定的离线曲线）搬到闭环后偏差**显著变大**
#       ⇒ 量化"离线标定 → 在线闭环"的分布偏移有多大
#
# ⚠ 仍然只用**逐包独立**丢包（周期 + 伯努利）。突发版本列为后续，不得在这里假装覆盖。

seed: 0
device: auto

env:
  id: uav-track
  max_steps: 700
  noise_std: 0.15

controller:
  omega_n: 2.5
  zeta: 1.0

design:
  snr_db_list: [14, 17, 20, 23, 26]
  bits_list: [4, 6, 8, 12]
  # 方形星座 ⇒ m 偶数；T = b/m 必须整除
  m_sym_list: [2, 4, 6, 8]
  max_period: 32
  range_margin: 0.05
  # 尾部质量上限（与 X34 同口径，用 periodic_age_tail 算）
  max_tail_mass: 0.02

data:
  n_episodes: 120
  eval_seed_offset: 1000
  online_seed_offset: 2000

model:
  latent_dim: 32
  hidden: 128
  discrete_act: false

train:
  epochs: 150
  batch_size: 256
  lr: 0.001
  weight_decay: 0.0
  grad_clip: 5.0
  val_ratio: 0.1

eval:
  horizons: [1, 2, 3, 4, 5, 6, 8, 10, 12, 15, 20, 25, 30, 40, 50, 75, 100, 150, 190]
  err_threshold: 0.05
  threshold_mode: rel
  n_samples: 2048

task:
  # ★ warmup 必须走完"初始捕获"瞬态：X30 实测 UAV 从 15 m 外收敛要 ~400 步，
  #   只给 250 步的话被测段的头 150 步仍在瞬态里（冒烟实测距离 4.5 m vs 稳态 0.40 m）
  warmup_steps: 400
  measured_steps: 300
  n_episodes: 40
  tail_frac: 0.25
  # 判据 T1/T3 用的相对退化的地板（避免除以 0）
  eps_floor: 1e-9

output:
  dir: outputs
